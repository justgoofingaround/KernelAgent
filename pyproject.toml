[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelagent"
version = "0.1.0"
description = "Agent-driven compiler that writes, verifies, profiles and tunes CUDA kernels for LLM inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy",
    "ninja",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kernelagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and nvcc (run on Colab)"]
